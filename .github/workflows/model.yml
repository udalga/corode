name: Build model

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  ROJO_VERSION: 7.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$ROJO_VERSION" -R rojo-rbx/rojo -p "rojo-$ROJO_VERSION-linux-x86_64.zip" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/rojo-$ROJO_VERSION-linux-x86_64.zip" -d "$RUNNER_TEMP/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Build
        run: |
          rojo build default.project.json -o Corode.rbxm
          # Only checks that the place project builds (the local demo scripts are optional).
          rojo build place.project.json -o "$RUNNER_TEMP/place.rbxl"

      - uses: actions/upload-artifact@v4
        with:
          name: Corode
          path: Corode.rbxm

  # Runs the tests on Roblox servers through Open Cloud. Skipped until the
  # ROBLOX_API_KEY secret exists, and on pull requests from forks.
  test:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: '10773475257'
      ROBLOX_PLACE_ID: '132170386245225'
    steps:
      - name: Check for the API key
        id: key
        run: echo "present=$([ -n "$ROBLOX_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install Rojo
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$ROJO_VERSION" -R rojo-rbx/rojo -p "rojo-$ROJO_VERSION-linux-x86_64.zip" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/rojo-$ROJO_VERSION-linux-x86_64.zip" -d "$RUNNER_TEMP/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Run tests on Roblox
        if: steps.key.outputs.present == 'true'
        run: |
          rojo build tests.project.json -o "$RUNNER_TEMP/CorodeCI.rbxm"
          node scripts/run-cloud-tests.mjs "$RUNNER_TEMP/CorodeCI.rbxm"

      - name: Skipped
        if: steps.key.outputs.present != 'true'
        run: |
          echo "::notice::Tests skipped. Add the ROBLOX_API_KEY secret to run them on Roblox."

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          version=$(grep -oP 'Version = "\K[^"]+' src/Corode/init.luau)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::src/Corode/init.luau says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Corode

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Corode.rbxm --title "Corode $GITHUB_REF_NAME" --generate-notes
